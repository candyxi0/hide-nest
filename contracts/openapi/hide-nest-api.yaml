openapi: "3.1.2"
info:
  title: HideNest API
  version: "0.1.0"
  description: >
    hide-nest memory system remote API.
    All responses carry Cache-Control: no-store.
    Error media type is application/problem+json (RFC 9457).

servers:
  - url: /v1
    description: Base path for all remote operations

# ──────────────────────────────────────────────────────────
# Security schemes
# ──────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: UUIDv7
      description: Session token issued by createSession
    deviceCredential:
      type: apiKey
      in: header
      name: X-Device-Credential
      description: Device proof for session creation
    actionCapability:
      type: apiKey
      in: header
      name: X-Action-Capability
      description: Action capability token for capability-gated operations

  # ────────────────────────────────────────────────────────
  # Reusable parameters
  # ────────────────────────────────────────────────────────
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated UUIDv7 idempotency key
    PathSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathMemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathDeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QueryCursor:
      name: cursor
      in: query
      schema:
        type: string
    QueryLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1

  # ────────────────────────────────────────────────────────
  # Reusable Problem responses
  # ────────────────────────────────────────────────────────
  responses:
    ProblemBadRequest:
      description: Bad request
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ProblemUnauthorized:
      description: Unauthorized
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ProblemForbidden:
      description: Forbidden
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ProblemNotFound:
      description: Not found
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ProblemConflict:
      description: Conflict
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ProblemGone:
      description: Gone
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ProblemUnprocessable:
      description: Unprocessable entity
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ProblemUnavailable:
      description: Service unavailable
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  # ────────────────────────────────────────────────────────
  # Schemas (44 total: 9 enums + 35 API/DTO schemas)
  # ────────────────────────────────────────────────────────
  schemas:
    # ─── Shared enums (9) ──────────────────────────────────
    ResultCategory:
      type: string
      enum:
        - SUCCEEDED
        - NO_RELEVANT_RESULT
        - DENIED
        - STALE
        - FAILED
        - PARTIALLY_DEGRADED

    MemoryState:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED

    MemoryType:
      type: string
      enum:
        - EVENT
        - CLAIM
        - QUOTE
        - INTERPRETATION
        - CALIBRATION
        - PRINCIPLE

    RelationType:
      type: string
      enum:
        - EVIDENCED_BY
        - INTERPRETS
        - SUPPORTS
        - REFINES
        - SUPERSEDES
        - CONFLICTS_WITH
        - CALIBRATES
        - PART_OF_TRAJECTORY
        - MERGED_INTO

    ReviewSessionState:
      type: string
      enum:
        - OPEN
        - COMPLETED
        - CANCELLED
        - EXPIRED

    RunPhase:
      type: string
      enum:
        - RECEIVED
        - DECISIONS_COMMITTED
        - CANONICAL_COMMITTED
        - INDEX_READY
        - FINAL_FAILED

    SourceAvailability:
      type: string
      enum:
        - AVAILABLE
        - UNAVAILABLE

    ComponentHealth:
      type: string
      enum:
        - HEALTHY
        - DEGRADED
        - UNAVAILABLE
        - DISABLED

    FailureCode:
      type: string
      enum:
        - REQUEST_SCHEMA_INVALID
        - REQUEST_TOO_LARGE
        - UNSUPPORTED_CONTRACT_VERSION
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - DEVICE_CREDENTIAL_INVALID
        - DEVICE_CREDENTIAL_EXPIRED
        - IDENTITY_ENTRY_UNREGISTERED
        - IDENTITY_BASELINE_STALE
        - MODEL_ROUTE_UNACCEPTED
        - IDENTITY_SESSION_EXPIRED
        - IDENTITY_SESSION_REVOKED
        - CAPABILITY_REQUIRED
        - CAPABILITY_EXPIRED
        - CAPABILITY_ALREADY_CONSUMED
        - CAPABILITY_SCOPE_MISMATCH
        - ACCESS_DENIED
        - POLICY_REVISION_STALE
        - DERIVATION_BLOCKED
        - DELETION_FENCED
        - THREAD_READER_UNSUPPORTED
        - THREAD_SCHEMA_UNKNOWN
        - SOURCE_RANGE_GAP
        - SOURCE_ORDER_INVALID
        - SOURCE_PAYLOAD_UNAVAILABLE
        - CAPTURE_SCOPE_STALE
        - REVIEW_SESSION_NOT_OPEN
        - REVIEW_MEMBER_MISMATCH
        - REVIEW_FINAL_INCOMPLETE
        - USER_CONFIRMATION_PROOF_INVALID
        - EXPECTED_REVISION_STALE
        - PROPOSAL_CONFLICT
        - CANONICAL_COMMIT_FAILED
        - RETRIEVAL_NO_MATCH
        - FTS_ROUTE_UNAVAILABLE
        - VECTOR_ROUTE_UNAVAILABLE
        - RANK_OUTPUT_INVALID
        - CONTEXT_PACK_EXPIRED
        - CONTEXT_PACK_INVALIDATED
        - DELETION_PREVIEW_STALE
        - DELETION_CLOSURE_MISMATCH
        - DELETION_EXECUTION_FAILED
        - RESTORE_CHECKPOINT_INVALID
        - RESTORE_GOVERNANCE_INCOMPLETE
        - RESTORE_TRUST_ANCHOR_INVALID
        - DATABASE_UNAVAILABLE
        - PAYLOAD_STORE_UNAVAILABLE
        - MODEL_PROVIDER_UNAVAILABLE
        - OUTBOX_FINAL_FAILED
        - INTERNAL_FAILURE

    # ─── Core DTOs (3) ─────────────────────────────────────
    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - requestId
        - resultCategory
        - failureCode
        - retryable
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        failureCode:
          $ref: "#/components/schemas/FailureCode"
        retryable:
          type: boolean
        affectedScope:
          type: string
      additionalProperties: false

    ActionResultResponse:
      type: object
      required:
        - requestId
        - resultCategory
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        targetId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        policyRevision:
          type: integer
          minimum: 0
      additionalProperties: false

    AsyncAcceptedResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - runId
        - statusUrl
        - phase
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        runId:
          type: string
          format: uuid
        statusUrl:
          type: string
          format: uri
        phase:
          $ref: "#/components/schemas/RunPhase"
      additionalProperties: false

    # ─── Identity DTOs ─────────────────────────────────────
    CreateSessionRequest:
      type: object
      required:
        - deviceCredential
      properties:
        deviceCredential:
          type: string
      additionalProperties: false

    CreateSessionResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - sessionId
        - sessionToken
        - expiresAt
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        sessionId:
          type: string
          format: uuid
        sessionToken:
          type: string
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false

    IssueCapabilityRequest:
      type: object
      required:
        - purpose
        - threadId
        - targetKind
        - targetId
        - targetRevision
        - requestHash
      properties:
        purpose:
          type: string
        threadId:
          type: string
          format: uuid
        targetKind:
          type: string
        targetId:
          type: string
          format: uuid
        targetRevision:
          type: integer
          minimum: 0
        requestHash:
          type: string
      additionalProperties: false

    IssueCapabilityResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - capabilityToken
        - expiresAt
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        capabilityToken:
          type: string
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false

    # ─── Closeout & Review DTOs ────────────────────────────
    HideSelectionSubmission:
      type: object
      required:
        - perspectiveActorId
        - memoryType
        - bodyText
        - bodyHash
      properties:
        perspectiveActorId:
          type: string
          format: uuid
        memoryType:
          $ref: "#/components/schemas/MemoryType"
        bodyText:
          type: string
          minLength: 1
          maxLength: 16000
        bodyHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
      additionalProperties: false

    UserConfirmationSubmission:
      type: object
      required:
        - decision
        - reviewManifestHash
        - confirmationSourceUnitId
      properties:
        decision:
          type: string
          const: CONFIRM
        reviewManifestHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        confirmationSourceUnitId:
          type: string
          format: uuid
      additionalProperties: false

    CloseoutAnchorUnitSubmission:
      type: object
      required:
        - sourceUnitId
        - fromOffset
        - toOffset
        - ordinal
      properties:
        sourceUnitId:
          type: string
          format: uuid
        fromOffset:
          type: integer
          minimum: 0
          nullable: true
        toOffset:
          type: integer
          minimum: 0
          nullable: true
        ordinal:
          type: integer
          minimum: 0
      additionalProperties: false

    CloseoutSourceAnchorSubmission:
      type: object
      required:
        - anchorId
        - units
      properties:
        anchorId:
          type: string
          format: uuid
        units:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CloseoutAnchorUnitSubmission"
      additionalProperties: false

    SyntheticEvidenceMessage:
      type: object
      required:
        - sourceUnitId
        - actorId
        - ordinal
        - externalUnitRef
        - occurredAt
        - bodyText
        - bodyHash
      properties:
        sourceUnitId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 0
        externalUnitRef:
          type: string
          minLength: 1
          maxLength: 256
        occurredAt:
          type: string
          format: date-time
        bodyText:
          type: string
          minLength: 1
        bodyHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
      additionalProperties: false

    SyntheticThreadReaderManifest:
      type: object
      required:
        - schemaVersion
        - fromOrdinal
        - toOrdinal
        - continuous
        - manifestHash
        - selectedEvidenceMessages
      properties:
        schemaVersion:
          type: string
          const: local-v1-synthetic-v1
        fromOrdinal:
          type: integer
          minimum: 0
        toOrdinal:
          type: integer
          minimum: 0
        continuous:
          type: boolean
        manifestHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        selectedEvidenceMessages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SyntheticEvidenceMessage"
      additionalProperties: false

    CloseoutSubmissionRequest:
      type: object
      required:
        - submissionId
        - threadId
        - hideSelection
        - userConfirmation
        - sourceAnchors
        - threadReaderManifest
        - confirmationProof
      properties:
        submissionId:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        hideSelection:
          $ref: "#/components/schemas/HideSelectionSubmission"
        userConfirmation:
          $ref: "#/components/schemas/UserConfirmationSubmission"
        sourceAnchors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CloseoutSourceAnchorSubmission"
        threadReaderManifest:
          $ref: "#/components/schemas/SyntheticThreadReaderManifest"
        confirmationProof:
          type: string
          pattern: "^[0-9a-f]{64}$"
      additionalProperties: false

    CloseoutReceipt:
      type: object
      required:
        - requestId
        - resultCategory
        - runId
        - statusUrl
        - phase
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        runId:
          type: string
          format: uuid
        statusUrl:
          type: string
          format: uri
        phase:
          $ref: "#/components/schemas/RunPhase"
      additionalProperties: false

    RunStatusResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - runId
        - phase
        - retryable
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        runId:
          type: string
          format: uuid
        phase:
          $ref: "#/components/schemas/RunPhase"
        retryable:
          type: boolean
        failureCode:
          $ref: "#/components/schemas/FailureCode"
        startedAt:
          type: string
          format: date-time
        terminalAt:
          type: string
          format: date-time
      additionalProperties: false

    ReviewSessionListResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - items
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        items:
          type: array
          items:
            type: object
            additionalProperties: false
        nextCursor:
          type: string
      additionalProperties: false

    ReviewSessionDetailResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - reviewSessionId
        - state
        - proposalRevisions
        - members
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        reviewSessionId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/ReviewSessionState"
        proposalRevisions:
          type: array
          items:
            type: object
            additionalProperties: false
        members:
          type: array
          items:
            type: object
            additionalProperties: false
      additionalProperties: false

    ReviewFinalSubmissionRequest:
      type: object
      required:
        - submissionId
        - threadId
        - userDecisions
        - threadReaderManifest
        - confirmationProof
      properties:
        submissionId:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        userDecisions:
          type: array
          items:
            type: object
            additionalProperties: false
        threadReaderManifest:
          type: object
          additionalProperties: false
        confirmationProof:
          type: string
      additionalProperties: false

    # ─── Context Pack DTOs ─────────────────────────────────
    ContextPackRequest:
      type: object
      required:
        - threadId
        - turnId
        - purpose
        - query
      properties:
        threadId:
          type: string
          format: uuid
        turnId:
          type: string
          format: uuid
        purpose:
          type: string
        query:
          type: string
      additionalProperties: false

    ContextPackResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - deliveryId
        - threadId
        - turnId
        - purpose
        - policyRevisionSet
        - issuedAt
        - expiresAt
        - budgetLimited
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        deliveryId:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        turnId:
          type: string
          format: uuid
        purpose:
          type: string
        policyRevisionSet:
          type: array
          items:
            type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        budgetLimited:
          type: boolean
        memories:
          type: array
          items:
            type: object
            additionalProperties: false
      additionalProperties: false

    DeepSearchRequest:
      type: object
      required:
        - threadId
        - turnId
        - purpose
        - query
      properties:
        threadId:
          type: string
          format: uuid
        turnId:
          type: string
          format: uuid
        purpose:
          type: string
        query:
          type: string
      additionalProperties: false

    DeepSearchResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - deliveryId
        - threadId
        - turnId
        - purpose
        - policyRevisionSet
        - issuedAt
        - expiresAt
        - budgetLimited
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        deliveryId:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        turnId:
          type: string
          format: uuid
        purpose:
          type: string
        policyRevisionSet:
          type: array
          items:
            type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        budgetLimited:
          type: boolean
        memories:
          type: array
          items:
            type: object
            additionalProperties: false
      additionalProperties: false

    HookBootstrapRequest:
      type: object
      required:
        - threadId
        - purpose
      properties:
        threadId:
          type: string
          format: uuid
        purpose:
          type: string
      additionalProperties: false

    HookBootstrapResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - deliveryId
        - identityLayer
        - expiresAt
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        deliveryId:
          type: string
          format: uuid
        identityLayer:
          type: object
          additionalProperties: false
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false

    # ─── Governance DTOs ───────────────────────────────────
    GovernanceActionRequest:
      type: object
      required:
        - targetId
        - expectedRevision
        - expectedPolicyRevision
        - requestManifestHash
      properties:
        targetId:
          type: string
          format: uuid
        expectedRevision:
          type: integer
          minimum: 1
        expectedPolicyRevision:
          type: integer
          minimum: 1
        requestManifestHash:
          type: string
      additionalProperties: false

    IsolationRestorePreviewResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - previewId
        - previewRevision
        - manifestHash
        - affectedItems
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        previewId:
          type: string
          format: uuid
        previewRevision:
          type: integer
          minimum: 1
        manifestHash:
          type: string
        affectedItems:
          type: array
          items:
            type: object
            additionalProperties: false
      additionalProperties: false

    DeletionPreviewResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - previewId
        - previewRevision
        - manifestHash
        - closureMembers
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        previewId:
          type: string
          format: uuid
        previewRevision:
          type: integer
          minimum: 1
        manifestHash:
          type: string
        closureMembers:
          type: array
          items:
            type: object
            additionalProperties: false
      additionalProperties: false

    DeletionConfirmRequest:
      type: object
      required:
        - targetId
        - expectedRevision
        - expectedPolicyRevision
        - requestManifestHash
        - previewId
        - previewRevision
        - manifestHash
      properties:
        targetId:
          type: string
          format: uuid
        expectedRevision:
          type: integer
          minimum: 1
        expectedPolicyRevision:
          type: integer
          minimum: 1
        requestManifestHash:
          type: string
        previewId:
          type: string
          format: uuid
        previewRevision:
          type: integer
          minimum: 1
        manifestHash:
          type: string
      additionalProperties: false

    ExportRequest:
      type: object
      required:
        - scope
        - format
      properties:
        scope:
          type: string
        format:
          type: string
      additionalProperties: false

    RestoreValidationRequest:
      type: object
      required:
        - checkpointId
      properties:
        checkpointId:
          type: string
          format: uuid
      additionalProperties: false

    # ─── Read-only Query DTOs ──────────────────────────────
    PaginatedCursorResponse:
      type: object
      properties:
        nextCursor:
          type: string
      additionalProperties: false

    MemoryListResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - items
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemoryListItem"
        nextCursor:
          type: string
      additionalProperties: false

    MemoryListItem:
      type: object
      required:
        - memoryId
        - currentRevisionId
        - revisionNo
        - state
        - isolated
        - memoryType
        - perspective
        - title
        - summary
        - sourceAvailability
        - updatedAt
      properties:
        memoryId:
          type: string
          format: uuid
        currentRevisionId:
          type: string
          format: uuid
        revisionNo:
          type: integer
          minimum: 1
        state:
          $ref: "#/components/schemas/MemoryState"
        isolated:
          type: boolean
        memoryType:
          $ref: "#/components/schemas/MemoryType"
        perspective:
          type: string
        title:
          type: string
        summary:
          type: string
        sourceAvailability:
          $ref: "#/components/schemas/SourceAvailability"
        uncertaintyCode:
          type: string
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    MemoryDetail:
      type: object
      required:
        - memoryId
        - currentRevisionId
        - revisionNo
        - state
        - memoryType
        - perspectiveActorId
        - bodyText
        - updatedAt
        - evidenceCount
      properties:
        memoryId:
          type: string
          format: uuid
        currentRevisionId:
          type: string
          format: uuid
        revisionNo:
          type: integer
          minimum: 1
        state:
          $ref: "#/components/schemas/MemoryState"
        memoryType:
          $ref: "#/components/schemas/MemoryType"
        perspectiveActorId:
          type: string
          format: uuid
        bodyText:
          type: string
        updatedAt:
          type: string
          format: date-time
        evidenceCount:
          type: integer
          minimum: 0
        uncertaintyCode:
          type: string
      additionalProperties: false

    MemoryDetailResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - memory
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        memory:
          $ref: "#/components/schemas/MemoryDetail"
      additionalProperties: false

    MemoryTrajectoryResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - items
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        items:
          type: array
          items:
            type: object
            additionalProperties: false
        nextCursor:
          type: string
      additionalProperties: false

    MemoryEvidenceItem:
      type: object
      required:
        - anchorId
        - sourceUnitId
        - ordinal
        - actorId
        - actorKind
        - actorStableRef
        - occurredAt
        - bodyText
      properties:
        anchorId:
          type: string
          format: uuid
        sourceUnitId:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 0
        actorId:
          type: string
          format: uuid
        actorKind:
          type: string
        actorStableRef:
          type: string
        occurredAt:
          type: string
          format: date-time
        bodyText:
          type: string
      additionalProperties: false

    MemoryEvidenceResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - memoryId
        - currentRevisionId
        - revisionNo
        - evidenceItems
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        memoryId:
          description: Canonical memory identifier.
          type: string
          format: uuid
        currentRevisionId:
          description: Current canonical memory revision identifier.
          type: string
          format: uuid
        revisionNo:
          description: Current canonical revision number.
          type: integer
          minimum: 1
        evidenceItems:
          description: All minimum-necessary evidence items saved for this memory revision.
          type: array
          items:
            $ref: "#/components/schemas/MemoryEvidenceItem"
      additionalProperties: false

    RunListResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - items
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        items:
          type: array
          items:
            type: object
            additionalProperties: false
        nextCursor:
          type: string
      additionalProperties: false

    SystemStatusResponse:
      type: object
      required:
        - requestId
        - resultCategory
        - components
        - productionAcceptsRealMaterial
      properties:
        requestId:
          type: string
          format: uuid
        resultCategory:
          $ref: "#/components/schemas/ResultCategory"
        components:
          type: array
          items:
            type: object
            required:
              - name
              - status
            properties:
              name:
                type: string
              status:
                $ref: "#/components/schemas/ComponentHealth"
              lastSuccessAt:
                type: string
                format: date-time
            additionalProperties: false
        productionAcceptsRealMaterial:
          type: boolean
      additionalProperties: false

